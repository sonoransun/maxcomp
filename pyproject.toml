[project]
name = "maxcomp"
version = "0.1.0"
description = "Universal re-compression of arbitrary bit streams"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "mpmath>=1.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
native = [
    "cffi>=1.16",
]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
    "hypothesis>=6.0",
]

[project.scripts]
maxcomp = "maxcomp.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
